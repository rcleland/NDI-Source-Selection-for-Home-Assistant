# Streaming source bar — branded icons (button-card)
# Requires: button-card (HACS)
# 1. Copy docs/icons/streaming/ to config/www/magewell-icons/streaming/
# 2. Replace select.magewell_decoder_source with your Source entity
# 3. Edit preset names if your decoder uses different labels

type: horizontal-stack
cards:
  - type: custom:button-card
    name: Apple TV
    show_name: true
    show_icon: false
    styles:
      card:
        - height: 96px
      custom_fields:
        icon:
          - width: 48px
          - height: 48px
          - margin: 0 auto 8px
    custom_fields:
      icon: |
        [[[
          return `<img src="/local/magewell-icons/streaming/apple-tv.svg" width="48" height="48" alt="Apple TV">`;
        ]]]
    tap_action:
      action: call-service
      service: magewell_pro_convert_decoder.switch_source
      service_data:
        entity_id: select.magewell_decoder_source
        source: Apple TV

