# https://www.home-assistant.io/docs/scripts/service-calls/
switch_source:
  name: Switch source by name
  description:
    Switch the decoder to a saved preset or NDI source using a plain name such as
    "Apple TV". Ideal for dashboard buttons, scripts, and automations. Provide
    either config_entry_id or the Source select entity_id.
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: magewell_pro_convert_decoder
    entity_id:
      required: false
      example: select.magewell_decoder_source
      selector:
        entity:
          integration: magewell_pro_convert_decoder
          domain: select
    source:
      required: true
      example: "Apple TV"
      selector:
        text:
    source_type:
      default: auto
      selector:
        select:
          options:
            - auto
            - ndi
            - preset
          translation_key: source_type
          sort: false

set_ndi_stream:
  name: Set NDI stream by name
  description:
    Tries set-channel with the exact NDI name. If the device rejects it, creates/updates
    an ntkndi preset (add-channel) using ndi_ip_port or a matching row from discovery, then selects that preset.
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: magewell_pro_convert_decoder
    entity_id:
      required: false
      selector:
        entity:
          integration: magewell_pro_convert_decoder
          domain: select
    ndi_name:
      required: true
      example: "DESKTOP-BH29KMO (Blackmagic WDM Capture)"
      selector:
        text:
    ndi_ip_port:
      example: "192.168.15.2:5961"
      selector:
        text:
    preset_label:
      default: "HA NDI"
      example: "HA NDI"
      selector:
        text:
    buffer_duration:
      default: 60
      selector:
        number:
          min: 1
          max: 8000
          mode: box

set_http_stream:
  name: Set HTTP / URL preset and select
  description:
    Adds or updates a preset channel (add-channel or modify-channel) then selects it.
    Use for RTSP, HTTP, HLS, or other URL presets (full URL including query params).
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: magewell_pro_convert_decoder
    entity_id:
      required: false
      selector:
        entity:
          integration: magewell_pro_convert_decoder
          domain: select
    channel_name:
      required: true
      example: "Apple TV"
      selector:
        text:
    url:
      required: true
      example: "rtsp://192.168.1.20:554/stream"
      selector:
        text:
          multiline: true
    update_if_exists:
      default: true
      selector:
        boolean:
