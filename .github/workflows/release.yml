name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration

  release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify manifest version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('custom_components/magewell_pro_convert_decoder/manifest.json'))['version'])")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag v$TAG does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Version $MANIFEST_VERSION matches tag."

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SECTION=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if ($2 == "[" ver "]") { found=1; next }
              if (found) exit
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "No CHANGELOG section for $VERSION; using generated notes."
            echo "body=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<EOF"
              echo "$SECTION"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          generate_release_notes: ${{ steps.changelog.outputs.body == '' }}
