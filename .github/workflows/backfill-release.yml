name: Backfill Release

# Publish a GitHub Release for an existing tag (e.g. v1.4.3) without bumping version.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish (e.g. v1.4.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Build release notes
        run: |
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if ($2 == "[" ver "]") { found=1; next }
              if (found) exit
            }
            found { print }
          ' CHANGELOG.md > /tmp/release_notes.md
          if [ ! -s /tmp/release_notes.md ]; then
            echo "Release $VERSION" > /tmp/release_notes.md
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body_path: /tmp/release_notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
